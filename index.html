<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vast Travel Pengelola</title><base target="_top">
<meta name="theme-color" content="#0b3d2a">



<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" media="print" onload="this.media='all'">
<style>
/* VAST TRAVEL - gaya bersama. Arah: alam hijau + energi listrik; hijau tua, hijau daun, aksen lime. */
:root {
  --bg: #f3f6f4; --card: #ffffff; --ink: #0f2a1e; --muted: #5f6f67; --line: #e1e8e4;
  --g900: #0b3d2a; --g800: #0f4d33; --g700: #13703f; --g600: #179a45; --g500: #22b14c; --g100: #e3f6e8; --g50: #f0faf2;
  --lime: #b6ee2a; --lime-ink: #1d3305;
  --amber: #b9770e; --amber-soft: #fdf1d9; --red: #d23b3b; --red-soft: #fde6e6; --blue: #2563eb; --blue-soft: #e5edff;
  --accent: var(--g600); --accent-soft: var(--g100);
  --shadow: 0 1px 2px rgba(15, 42, 30, .06), 0 8px 24px rgba(15, 42, 30, .08);
  --f-display: "Plus Jakarta Sans", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent; }
body.noscroll { overflow: hidden; }
.wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: calc(86px + env(safe-area-inset-bottom)); position: relative; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; font-weight: 800; }
h2 { font-size: 20px; } h3 { font-size: 16.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; } .xs { font-size: 12px; }
:focus-visible { outline: 3px solid var(--g500); outline-offset: 2px; }
a { color: var(--g700); }
.ic { width: 22px; height: 22px; flex: none; }

/* ---------- Hero / header bergambar ---------- */
.hero { position: relative; color: #fff; padding: calc(14px + env(safe-area-inset-top)) 18px 92px; overflow: hidden; background: var(--g900); }
.hero .scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.hero > *:not(.scene) { position: relative; z-index: 1; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand-logo { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-logo .mchip { width: 44px; height: 44px; border-radius: 13px; background: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
.brand-logo .mchip img { width: 36px; height: auto; }
.brand-logo img.word { height: 22px; width: auto; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .35)); }
.brand-logo .role { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--lime); color: var(--lime-ink); padding: 3px 8px; border-radius: 99px; }
img.mark { width: 64px; height: auto; }
.hbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .16); backdrop-filter: blur(6px); color: #fff; display: grid; place-items: center; cursor: pointer; position: relative; }
.hbtn .ic { width: 21px; height: 21px; }
.hbtn .dot { position: absolute; top: 4px; right: 4px; min-width: 17px; height: 17px; border-radius: 99px; background: #ef4444; color: #fff; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; border: 2px solid rgba(255, 255, 255, .8); }
.hello { margin-top: 18px; }
.hello h1 { font-size: 25px; line-height: 1.2; text-shadow: 0 2px 10px rgba(0, 0, 0, .3); }
.hello p { margin: 4px 0 0; color: rgba(255, 255, 255, .88); font-size: 14px; }
.hero.short { padding-bottom: 24px; }
.subhead { position: sticky; top: 0; z-index: 10; background: var(--g900); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 10px; }
.subhead h2 { font-size: 18px; flex: 1; }

/* Kartu yang menumpang di bawah hero */
.float { margin: -72px 16px 0; position: relative; z-index: 2; }
.search { background: var(--card); border-radius: 22px; box-shadow: 0 10px 30px rgba(11, 61, 42, .18); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sel { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; background: #fff; }
.sel select, .sel input { border: 0; outline: 0; background: transparent; font: 700 15px var(--f-body); color: var(--ink); width: 100%; min-height: 40px; padding: 0; }
.sel .ic { color: var(--g700); }
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.date { min-width: 0; border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; background: var(--g50); }
.date .ic { color: var(--g700); width: 20px; height: 20px; }
.date label { display: flex; flex-direction: column; font-size: 11.5px; color: var(--muted); font-weight: 600; flex: 1; min-width: 0; }
.date input { min-width: 0; border: 0; background: transparent; font: 800 13.5px var(--f-body); color: var(--ink); padding: 0; min-height: 24px; width: 100%; outline: 0; }
.btn.lime { background: var(--lime); color: var(--lime-ink); }

/* Grid menu cepat */
main { padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.qgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.q { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font: 700 11.5px/1.25 var(--f-body); color: var(--ink); text-align: center; cursor: pointer; position: relative; box-shadow: 0 1px 2px rgba(15, 42, 30, .04); }
.q .qi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--g100); color: var(--g700); }
.q .qi .ic { width: 22px; height: 22px; }
.q:active { transform: scale(.97); }
.q .n { position: absolute; top: 6px; right: 8px; background: #ef4444; color: #fff; font-size: 10px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 99px; display: grid; place-items: center; padding: 0 4px; }

/* Banner promo */
.promos { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.promos::-webkit-scrollbar { display: none; }
.promo { flex: 0 0 100%; scroll-snap-align: start; position: relative; overflow: hidden; border-radius: 20px; padding: 18px; min-height: 128px; color: #fff; background: linear-gradient(120deg, #0b3d2a 0%, #13703f 55%, #22b14c 100%); }
.promo h3 { font-size: 19px; max-width: 58%; line-height: 1.2; }
.promo .badge2 { display: inline-block; max-width: 58%; position: relative; z-index: 1; margin-top: 10px; background: #ffd43b; color: #2b2200; font-weight: 800; font-size: 13px; padding: 5px 12px; border-radius: 10px; }
.promo .veh { position: absolute; right: -14px; bottom: -4px; width: 44%; }
.promo .leaf { position: absolute; right: 38%; top: 12px; width: 30px; height: 30px; color: var(--lime); }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: -6px; }
.dots i { width: 7px; height: 7px; border-radius: 99px; background: #cfd8d3; }
.dots i.on { width: 18px; background: var(--g500); }

/* Pilihan kendaraan (kategori) */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h a, .sec-h button.linkbtn { font-size: 13px; font-weight: 700; color: var(--g600); text-decoration: none; }
.cats { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: 0 0 104px; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font: 800 12.5px var(--f-body); color: var(--ink); }
.cat .veh { width: 100%; height: 50px; }
.cat small { font-weight: 600; color: var(--muted); font-size: 10.5px; }
.cat[aria-pressed="true"] { border-color: var(--g500); background: var(--g50); color: var(--g700); box-shadow: 0 0 0 3px rgba(34, 177, 76, .15); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 7px 14px; font: 700 13px var(--f-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--g700); border-color: var(--g700); color: #fff; }
.chip .n { opacity: .65; font-weight: 600; margin-left: 4px; }

/* Kartu */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrapflex { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.uimg { flex: none; background: linear-gradient(170deg, #eef6f1 0%, #dcebe2 100%); border-radius: 14px; display: grid; place-items: center; overflow: hidden; aspect-ratio: 16/10; position: relative; }
.uimg img { width: 100%; height: 100%; object-fit: cover; }
.uimg .veh { width: 86%; }
.uimg.sm { width: 84px; aspect-ratio: 4/3; border-radius: 12px; }
.photo-tag { position: absolute; left: 6px; top: 6px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 99px; }

.unit { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; font: inherit; color: inherit; box-shadow: var(--shadow); }
.unit:active { transform: scale(.98); }
.unit .nm { font-weight: 800; line-height: 1.2; font-size: 15px; }
.unit .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.unit .pr { font-weight: 800; font-size: 15px; color: var(--g700); }
.unit .pr small { font-weight: 600; font-size: 12px; color: var(--muted); }
.unit.off { opacity: .5; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--g100); color: var(--g700); }
.tag.no { background: var(--red-soft); color: var(--red); }
.tag.wait { background: var(--amber-soft); color: var(--amber); }
.tag.lime { background: var(--lime); color: var(--lime-ink); }

/* Detail kendaraan */
.detail-hero { position: relative; height: 290px; color: #fff; overflow: hidden; background: var(--g900); }
.detail-hero .scene, .detail-hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.detail-hero .veh { position: absolute; left: 6%; right: 6%; bottom: 70px; width: 88%; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .35)); }
.detail-hero .bar { position: absolute; top: 0; left: 0; right: 0; padding: calc(12px + env(safe-area-inset-top)) 12px 10px; display: flex; align-items: center; gap: 8px; z-index: 2; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent); }
.detail-hero .bar h2 { flex: 1; text-align: center; font-size: 17px; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
.detail-hero .ttl { position: absolute; left: 18px; bottom: 34px; z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.detail-hero .ttl h1 { font-size: 26px; }
.detail-hero .ttl div { font-size: 14px; opacity: .92; }
.detail-hero .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0, 0, 0, .55)); }
.detail-hero .gdots { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; z-index: 2; }
.detail-hero .gdots i { width: 7px; height: 7px; border-radius: 99px; background: rgba(255,255,255,.55); }
.detail-hero .gdots i.on { background: #fff; }
.gal { position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.gal::-webkit-scrollbar { display: none; }
.gal img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
.specs { margin: -22px 14px 0; position: relative; z-index: 3; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(4, 1fr); padding: 12px 4px; }
.spec { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; padding: 0 4px; border-right: 1px solid var(--line); }
.spec:last-child { border-right: 0; }
.spec .ic { color: var(--g600); width: 24px; height: 24px; }
.spec b { font-size: 13px; line-height: 1.2; }
.spec span { font-size: 10.5px; color: var(--muted); line-height: 1.2; }
.durs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.dur { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--card); text-align: left; font: inherit; color: inherit; cursor: pointer; position: relative; }
.dur b { display: block; font-size: 14px; }
.dur .p, .dur small { display: block; }
.dur .p { font-weight: 800; font-size: 16px; }
.dur small { color: var(--g600); font-weight: 700; }
.dur[aria-pressed="true"] { border-color: var(--g500); background: var(--g50); box-shadow: 0 0 0 3px rgba(34, 177, 76, .15); }
.dur[aria-pressed="true"]::after { content: "✓"; position: absolute; right: 10px; top: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--g600); color: #fff; font-size: 12px; display: grid; place-items: center; font-weight: 800; }
.loc { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--card); }
.loc .ic { color: var(--g700); }
.totalbar { position: sticky; bottom: 0; background: var(--card); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px rgba(15, 42, 30, .1); margin-top: 16px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; z-index: 5; }
.totalbar .t { display: flex; align-items: baseline; gap: 6px; }
.totalbar .t b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.btn.go { background: linear-gradient(90deg, #17a14a, #22c04f); color: #fff; font-size: 17px; padding: 15px; border-radius: 99px; box-shadow: 0 8px 20px rgba(23, 161, 74, .35); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 12px 16px; font: 800 15px var(--f-body); background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; text-align: center; }
.btn .ic { width: 19px; height: 19px; }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 11px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.soft { background: var(--g100); color: var(--g800); }
.btn.warn { background: var(--red-soft); color: var(--red); }
.btn.wa { background: #1fa855; color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.row-btn { display: flex; gap: 8px; flex-wrap: wrap; }
.row-btn > .btn { flex: 1; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--g700); text-decoration: underline; cursor: pointer; font-weight: 700; }

.pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.st-menunggu_harga { background: var(--blue-soft); color: var(--blue); }
.st-menunggu_bayar { background: var(--amber-soft); color: var(--amber); }
.st-cek { background: var(--red-soft); color: var(--red); }
.st-lunas { background: var(--g100); color: var(--g700); }
.st-berjalan { background: var(--lime); color: var(--lime-ink); }
.st-selesai { background: #e8eceb; color: #36524a; }
.st-batal { background: #eceff1; color: #8a9499; }
.bk { border-left: 4px solid var(--line); }
.bk.l-menunggu_harga { border-left-color: var(--blue); } .bk.l-menunggu_bayar { border-left-color: var(--amber); } .bk.l-cek { border-left-color: var(--red); }
.bk.l-lunas { border-left-color: var(--g600); } .bk.l-berjalan { border-left-color: #8fc31f; } .bk.l-selesai { border-left-color: #8aa39a; }
.oid { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; }
.lines { border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); padding: 8px 0; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.lines .l { display: flex; justify-content: space-between; gap: 10px; }
.tot { display: flex; justify-content: space-between; font-weight: 800; }
.kv { display: grid; grid-template-columns: 100px 1fr; gap: 3px 10px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

/* Pembayaran */
.pays { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pay-o { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; font: 700 11.5px var(--f-body); color: var(--ink); }
.pay-o .lg { height: 26px; min-width: 56px; padding: 0 8px; border-radius: 8px; display: grid; place-items: center; color: #fff; font: italic 900 13px var(--f-body); letter-spacing: -.02em; }
.pay-o[aria-pressed="true"] { border-color: var(--g500); background: var(--g50); box-shadow: 0 0 0 3px rgba(34, 177, 76, .15); }
.paybox { background: linear-gradient(135deg, var(--g900), var(--g700)); color: #fff; border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.paybox .amt { font-size: 28px; font-weight: 800; color: var(--lime); letter-spacing: -.02em; }
.paybox .rek { background: rgba(255, 255, 255, .12); border-radius: 12px; padding: 10px 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.paybox img.qris { width: 220px; max-width: 100%; background: #fff; border-radius: 12px; padding: 8px; align-self: center; }
.poinbox { border: 1.5px dashed var(--g500); background: var(--g50); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

/* Poin */
.poincard { position: relative; overflow: hidden; border-radius: 22px; padding: 18px; color: #fff; background: linear-gradient(130deg, #0b3d2a, #13703f 60%, #4cc737); box-shadow: var(--shadow); }
.poincard .big { font-size: 36px; font-weight: 800; letter-spacing: -.02em; }
.poincard .ic.bg { position: absolute; right: -12px; top: -12px; width: 120px; height: 120px; color: rgba(255,255,255,.12); }
.poincard small { opacity: .85; }

/* Statistik */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.tile .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 700; }
.tile.hot { background: linear-gradient(135deg, var(--g900), var(--g700)); border-color: transparent; color: #fff; }
.tile.hot .k { color: rgba(255, 255, 255, .8); } .tile.hot .v { color: var(--lime); }
.tile.alert { background: var(--red-soft); border-color: transparent; } .tile.alert .v { color: var(--red); }
.statcard { background: var(--card); border-radius: 22px; box-shadow: 0 10px 30px rgba(11, 61, 42, .16); padding: 14px; display: grid; grid-template-columns: repeat(3, 1fr); }
.statcard > div { text-align: center; padding: 0 6px; border-right: 1px solid var(--line); }
.statcard > div:last-child { border-right: 0; }
.statcard b { display: block; font-size: 18px; font-weight: 800; color: var(--g700); }
.statcard span { font-size: 11.5px; color: var(--muted); font-weight: 600; }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 700; }
.f input, .f select, .f textarea { font: 15px var(--f-body); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-height: 46px; }
.f textarea { min-height: 76px; resize: vertical; }
.f .hint { font-weight: 500; color: var(--muted); font-size: 12px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; background: var(--card); }
.opt input { margin-top: 3px; accent-color: var(--g600); }
.opt:has(input:checked) { border-color: var(--g500); background: var(--g50); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Bottom nav dengan tombol petir di tengah */

#toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--g900); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; max-width: 90%; text-align: center; }

    for (var i = 0; i < n; i++) s += c.charAt(Math.floor(Math.random() * c.length));
    return prefix + s;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function nowIso() { return new Date().toISOString(); }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function yes(v) { var s = String(v).toLowerCase(); return v === true || s === 'ya' || s === 'true'; }
  function txt(v, max) { return String(v === undefined || v === null ? '' : v).trim().slice(0, max || 200); }
  function parseJson(v, d) { if (v && typeof v === 'object') return v; try { return JSON.parse(v); } catch (e) { return d; } }
  function pin4() { return String(1000 + Math.floor(Math.random() * 9000)); }
  function rp(n) { return 'Rp' + Math.round(n).toLocaleString('id-ID'); }

  var _set = null;
  function settings() {
    if (_set) return _set;
    var o = {}, k;
    for (k in VR_DEFAULTS) o[k] = VR_DEFAULTS[k];
    store.all('Pengaturan').forEach(function (r) {
      var key = String(r.kunci), v = String(r.nilai);
      if (v !== '' || !(key in VR_DEFAULTS) || VR_EMPTY_OK.indexOf(key) >= 0) o[key] = v;
    });
    if (!o.rek_bca && o.rekening) o.rek_bca = o.rekening;
    _set = o; return o;
  }
  function setSetting(k, v) {
    _set = null;
    var ex = store.all('Pengaturan').filter(function (r) { return String(r.kunci) === k; })[0];
    if (ex) store.update('Pengaturan', 'kunci', k, { nilai: String(v) });
    else store.insert('Pengaturan', { kunci: k, nilai: String(v) });
  }
  function tarifOf(s, jenis) { return num(s[VR_JENIS[jenis].tarifKey]); }
  function komisiOf(s) { var k = num(s.komisi); return k >= 0 && k < 100 ? k : 15; }
  /* Daftar driver di pengaturan: "Nama=nomorWA=PIN;Nama2=nomorWA=PIN" (PIN untuk masuk mode Driver di aplikasi Mitra) */
  function drivers(s, denganPin) {
    return String(s.driver || '').split(';').map(function (x) {
      var p = x.split('='), nama = String(p[0] || '').trim();
      if (!nama) return null;
      var o = { nama: nama, wa: vrNormWa(p[1] || '') };
      if (denganPin) o.pin = String(p[2] || '').trim();
      return o;
    }).filter(Boolean);
  }
  function authDriver(req) {
    var wa = vrNormWa(req.wa), pin = String(req.pin || '');
    var d = drivers(settings(), true).filter(function (x) { return x.wa && x.wa === wa; })[0];
    if (!d || !d.pin || d.pin !== pin) fail('Nomor driver atau PIN salah. PIN driver diatur pengelola.');
    return d;
  }

  function publicApp() {
    var s = settings(), o = {};
    VR_PUBLIC_SETTINGS.forEach(function (k) { o[k] = s[k] || ''; });
    o.admin_wa = vrNormWa(o.admin_wa);
    o.batas_bayar_jam = num(o.batas_bayar_jam) || 3;
    o.maks_hari = num(o.maks_hari) || 29;
    o.tarif = { motor: tarifOf(s, 'motor'), mobil5: tarifOf(s, 'mobil5'), mobil7: tarifOf(s, 'mobil7') };
    o.komisi = komisiOf(s);
    o.kota = vrList(s.kota);
    o.bandara = vrList(s.bandara);
    o.outlet = vrParsePairs(s.outlet).map(function (z) { return { nama: z.nama, alamat: z.nilai }; });
    o.promo = vrParsePairs(s.promo).map(function (z) { return { judul: z.nama, sub: z.nilai }; });
    o.bayar = VR_PAY.map(function (p) { return { k: p.k, label: p.label, warna: p.warna, akun: s[p.set] || '' }; })
      .filter(function (p) { return p.akun; });
    o.poin = { per_rp: num(s.poin_per_rp) || 1000, min: num(s.poin_min_tukar) || 0, maks_persen: num(s.poin_maks_persen) || 50 };
    o.model = models(false);
    return o;
  }
  function modelOut(m) {
    return { id: String(m.id), merk: String(m.merk), model: String(m.model), jenis: String(m.jenis), kapasitas: num(m.kapasitas) || (VR_JENIS[m.jenis] || {}).kapasitas,
      foto: String(m.foto || ''), urut: num(m.urut), status: String(m.status || 'aktif') };
  }
  function models(semua) {
    var rows = store.all('Model');
    rows = rows.length ? rows : VR_MODEL;
    return rows.map(modelOut).filter(function (m) { return m.merk && (semua || m.status === 'aktif'); })
      .sort(function (a, b) { return (a.urut || 999) - (b.urut || 999); });
  }
  function seedModel() { if (!store.all('Model').length) VR_MODEL.forEach(function (m) { store.insert('Model', m); }); }
  function unitPublic(u) {
    return { id: String(u.id), jenis: u.jenis, merk: u.merk, model: u.model, tahun: String(u.tahun || ''), warna: u.warna,
      transmisi: u.transmisi, kapasitas: num(u.kapasitas) || (VR_JENIS[u.jenis] || {}).kapasitas, kota: u.kota, foto: u.foto, fitur: u.fitur,
      jarak_km: num(u.jarak_km), charging: String(u.charging || ''), bagasi: String(u.bagasi || ''), model_id: String(u.model_id || '') };
  }
  function unitFull(u) {
    var x = unitPublic(u); x.pemilik_id = String(u.pemilik_id); x.tnkb = u.tnkb; x.status = u.status; x.tersedia = yes(u.tersedia); x.diubah = String(u.diubah);
    return x;
  }
  function pemilikOut(p) {
    return { id: String(p.id), nama: p.nama, wa: vrNormWa(p.wa), alamat: p.alamat, kota: p.kota, bank: p.bank, status: p.status, dibuat: String(p.dibuat) };
  }
  function memberOut(m) {
    return { id: String(m.id), nama: m.nama, wa: vrNormWa(m.wa), alamat: m.alamat, kota: m.kota, status: m.status, catatan: m.catatan, dibuat: String(m.dibuat) };
  }
  function bookingOut(b) {
    var u = b.unit_id ? findUnit(b.unit_id) : null;
    var total = num(b.total), disk = num(b.diskon_poin);
    return {
      id: String(b.id), waktu: String(b.waktu), unit_id: String(b.unit_id || ''), unit: u ? unitPublic(u) : null, tnkb: u ? u.tnkb : '',
      pemilik_id: String(b.pemilik_id || ''), member_id: String(b.member_id || ''), nama: b.nama, hp: vrNormWa(b.hp), layanan: b.layanan,
      tipe: b.tipe || (VR_LAYANAN[b.layanan] || {}).tipe || 'harian', jenis_unit: b.jenis_unit || (u ? u.jenis : ''),
      penumpang: num(b.penumpang), bandara: String(b.bandara || ''),
      tgl_mulai: vrDateKey(b.tgl_mulai), durasi: num(b.durasi), tgl_selesai: vrDateKey(b.tgl_selesai), jam: String(b.jam || ''),
      lokasi: b.lokasi, tujuan: b.tujuan, catatan: b.catatan, tarif: num(b.tarif), total: total, komisi: num(b.komisi),
      bagian_pemilik: num(b.bagian_pemilik), diskon_poin: disk, bayar: total - disk,
      poin_didapat: num(b.poin_didapat), metode: b.metode, bayar_lapor: String(b.bayar_lapor || ''), status: b.status,
      unit_siap: yes(b.unit_siap), driver: b.driver, payout: b.payout === 'sudah' ? 'sudah' : 'belum', payout_waktu: String(b.payout_waktu || ''),
      harga_waktu: String(b.harga_waktu || ''), riwayat: parseJson(b.riwayat, []), diubah: String(b.diubah)
    };
  }
  /* Versi untuk pemilik unit: tanpa identitas & kontak perental */
  function bookingForOwner(b) {
    var o = bookingOut(b);
    return { id: o.id, waktu: o.waktu, unit_id: o.unit_id, unit: o.unit, tnkb: o.tnkb, layanan: o.layanan, tipe: o.tipe, tgl_mulai: o.tgl_mulai,
      durasi: o.durasi, tgl_selesai: o.tgl_selesai, jam: o.jam, total: o.total, komisi: o.komisi, bagian_pemilik: o.bagian_pemilik,
      status: o.status, unit_siap: o.unit_siap, driver: o.driver, payout: o.payout, payout_waktu: o.payout_waktu, kota: o.unit ? o.unit.kota : '' };
  }

  function byId(t, id) { id = String(id || '').toUpperCase(); return store.all(t).filter(function (r) { return String(r.id).toUpperCase() === id; })[0]; }
  function findUnit(id) { return byId('Unit', id); }
  function findBooking(id) { return byId('Booking', id); }
  function unitAktif(u) { return u && u.status === 'aktif' && yes(u.tersedia); }

  function kedaluwarsa(b, s) {
    if (b.status !== 'menunggu_bayar' || String(b.bayar_lapor || '')) return false;
    var jam = num(s.batas_bayar_jam) || 3, t0 = new Date(b.harga_waktu || b.waktu).getTime();
    return Date.now() - t0 > jam * 3600000;
  }
  function mengunci(b, s) {
    if (!b.unit_id) return false;
    return (b.status === 'menunggu_bayar' && !kedaluwarsa(b, s)) || b.status === 'lunas' || b.status === 'berjalan';
  }
  function jadwalTerpakai(s) {
    var m = {};
    store.all('Booking').forEach(function (b) {
      if (!mengunci(b, s)) return;
      (m[String(b.unit_id)] = m[String(b.unit_id)] || []).push([vrDateKey(b.tgl_mulai), vrDateKey(b.tgl_selesai)]);
    });
    return m;
  }
  function bentrok(unitId, mulai, selesai, kecualiId, s) {
    return store.all('Booking').some(function (b) {
      return String(b.unit_id) === String(unitId) && String(b.id) !== String(kecualiId || '') && mengunci(b, s) &&
        vrOverlap(mulai, selesai, vrDateKey(b.tgl_mulai), vrDateKey(b.tgl_selesai));
    });
  }

  /* ---------- Notifikasi ---------- */
  function notify(untuk, judul, isi, ref) {
    var w = nowIso();
    store.insert('Notif', { id: rid('N', 8), waktu: w, untuk: untuk, judul: txt(judul, 80), isi: txt(isi, 300), ref: ref || '' });
    if (store.push) { try { kirimPush(untuk, txt(judul, 80), txt(isi, 300), ref || '', w); } catch (e) { /* notifikasi tetap tersimpan */ } }
  }
  /* Push notification realtime (Firebase) ke HP yang terdaftar di sheet Perangkat. */
  function kirimPush(untuk, judul, isi, ref, waktu) {
    var peran = untuk === 'admin' ? 'pengelola' : untuk.indexOf('P:') === 0 ? 'pemilik' : 'perental', kunci = untuk;
    if (untuk.indexOf('B:') === 0) { var b = findBooking(untuk.slice(2)); if (!b) return; kunci = 'H:' + vrNormWa(b.hp); }
    var tokens = store.all('Perangkat').filter(function (d) { return d.peran === peran && String(d.kunci) === kunci && d.token; })
      .map(function (d) { return String(d.token); });
    if (tokens.length) store.push(tokens, judul, isi, { ref: String(ref), untuk: String(untuk), peran: peran, waktu: waktu });
  }
  function unitLabel(b) { var u = b.unit_id ? findUnit(b.unit_id) : null; return u ? u.merk + ' ' + u.model : (VR_JENIS[b.jenis_unit] || {}).label || 'kendaraan'; }
  function notifPerental(b, judul, isi) { notify('B:' + b.id, judul, isi, b.id); }

  /* ---------- Poin ---------- */
  function saldoPoin(hp) {
    hp = vrNormWa(hp); var t = 0;
    store.all('Poin').forEach(function (p) { if (vrNormWa(p.hp) === hp) t += num(p.delta); });
    return t;
  }
  function catatPoin(hp, delta, bid, ket) {
    if (!delta) return;
    store.insert('Poin', { id: rid('T', 8), waktu: nowIso(), hp: vrNormWa(hp), delta: Math.round(delta), booking_id: bid || '', ket: txt(ket, 120) });
  }

  function authPemilik(req) {
    var p = byId('Pemilik', req.pemilik_id);
    if (!p || !String(p.pin) || String(p.pin) !== String(req.pin)) fail('ID mitra atau PIN salah.');
    if (p.status !== 'aktif') fail('Akun mitra belum aktif. Tunggu verifikasi pengelola.');
    return p;
  }
  function authMember(req) {
    var m = byId('Member', req.member_id);
    if (!m || !String(m.pin) || String(m.pin) !== String(req.pin)) fail('ID member atau PIN salah.');
    if (m.status !== 'terverifikasi') fail('Member belum terverifikasi.');
    return m;
  }
  /* monitorOk: PIN admin ke-2 (monitor) boleh untuk aksi baca saja */
  function authAdmin(req, monitorOk) {
    var s = settings(), pin = String(req.pin || '');
    if (pin && s.admin_pin && pin === String(s.admin_pin)) return s;
    if (pin && s.monitor_pin && pin === String(s.monitor_pin)) {
      if (monitorOk) { s.__monitor = true; return s; }
      fail('Akun monitor hanya bisa melihat data, tidak bisa mengubah.');
    }
    fail('PIN pengelola salah.');
  }

  /* ---------- Live location (disimpan di cache, bukan sheet) ---------- */
  function bookingAktifLacak(b) { return b && (b.status === 'berjalan' || (b.status === 'lunas' && b.driver)); }
  function lokasiOf(id) { return store.liveGet ? store.liveGet('L:' + id) : null; }
  function liveItem(b) {
    var u = b.unit_id ? findUnit(b.unit_id) : null;
    return { booking_id: String(b.id), status: b.status, layanan: b.layanan, nama: b.nama, driver: b.driver || '', tgl_selesai: String(b.tgl_selesai),
      unit: u ? { id: String(u.id), merk: u.merk, model: u.model, warna: u.warna, tnkb: u.tnkb, jenis: u.jenis, foto: String(u.foto || ''), model_id: String(u.model_id || ''), pemilik_id: String(u.pemilik_id) } : null,
      pemilik_id: String(b.pemilik_id || ''), lok: lokasiOf(b.id) };
  }
  function findByLogin(t, login) {
    login = String(login || '').trim();
    var wa = vrNormWa(login);
    return byId(t, login) || store.all(t).filter(function (x) { return wa.length >= 10 && vrNormWa(x.wa) === wa; })[0];
  }
  function perentalDari(req) {
    var member = null, nama, hp;
    if (req.member_id) { member = authMember(req); nama = member.nama; hp = vrNormWa(member.wa); }
    else { var b0 = req.perental || {}; nama = txt(b0.nama, 80); hp = vrNormWa(b0.hp); }
    if (!nama) fail('Isi nama perental.');
    if (hp.length < 10) fail('Nomor WhatsApp tidak valid.');
    return { member: member, nama: nama, hp: hp };
  }
  function newBookingId() {
    var now = new Date(), stamp = String(now.getFullYear()).slice(2) + pad(now.getMonth() + 1) + pad(now.getDate()), id;
    do { id = 'VT-' + stamp + '-' + rid('', 4); } while (findBooking(id));
    return id;
  }

  function changeStatus(b, status, oleh, extra) {
    var riw = parseJson(b.riwayat, []);
    riw.push({ s: status, t: nowIso(), oleh: oleh });
    var patch = { status: status, riwayat: JSON.stringify(riw), diubah: nowIso() };
    if (extra) for (var k in extra) patch[k] = extra[k];
    store.update('Booking', 'id', b.id, patch);
    return bookingOut(findBooking(b.id));
  }
  function addRiwayat(b, label, oleh, patch) {
    var riw = parseJson(b.riwayat, []);
    riw.push({ s: label, t: nowIso(), oleh: oleh });
    patch = patch || {}; patch.riwayat = JSON.stringify(riw); patch.diubah = nowIso();
    store.update('Booking', 'id', b.id, patch);
    return bookingOut(findBooking(b.id));
  }
  function pernahLunas(b) { return parseJson(b.riwayat, []).some(function (r) { return r.s === 'lunas'; }); }
  function kembalikanPoin(b, ket) {
    var d = num(b.diskon_poin);
    if (d > 0) { catatPoin(b.hp, d, b.id, ket); store.update('Booking', 'id', b.id, { diskon_poin: 0, bayar: num(b.total) }); }
  }
  function batalkan(b, oleh) {
    var adaPoin = num(b.diskon_poin) > 0;
    kembalikanPoin(b, 'Pengembalian poin (booking batal)');
    var o = changeStatus(findBooking(b.id), 'batal', oleh);
    notifPerental(b, 'Booking dibatalkan', 'Booking ' + b.id + ' dibatalkan.' + (adaPoin ? ' Poin Anda sudah dikembalikan.' : ''));
    return o;
  }

  var actions = {
    /* ---------- PERENTAL ---------- */
    katalog: function () {
      var s = settings(), pemilikAktif = {};
      store.all('Pemilik').forEach(function (p) { if (p.status === 'aktif') pemilikAktif[String(p.id)] = true; });
      var units = store.all('Unit').filter(function (u) { return unitAktif(u) && pemilikAktif[String(u.pemilik_id)]; });
      var jadwal = jadwalTerpakai(s), terpakai = {};
      units.forEach(function (u) { terpakai[String(u.id)] = jadwal[String(u.id)] || []; });
      return { app: publicApp(), unit: units.map(unitPublic), terpakai: terpakai, hari_ini: vrToday() };
    },
    buatBooking: function (req) {
      var s = settings(), u = findUnit(req.unit_id);
      if (!unitAktif(u)) fail('Unit tidak tersedia. Pilih unit lain.');
      var pem = byId('Pemilik', u.pemilik_id);
      if (!pem || pem.status !== 'aktif') fail('Unit tidak tersedia. Pilih unit lain.');
      var jenis = VR_JENIS[u.jenis], layanan = String(req.layanan || '');
      if (!jenis || jenis.layanan.indexOf(layanan) < 0) fail('Pilih jenis layanan yang tersedia untuk unit ini.');
      if (layanan === 'lepas' && !req.member_id) fail('Lepas kunci khusus member terverifikasi. Masuk sebagai member atau daftar dulu.');
      var P = perentalDari(req);
      var mulai = vrDateKey(req.tgl_mulai), durasi = Math.floor(num(req.durasi)), maks = num(s.maks_hari) || 29;
      if (!mulai) fail('Pilih tanggal mulai sewa.');
      if (mulai < vrToday()) fail('Tanggal mulai tidak boleh sebelum hari ini.');
      if (durasi < 1) fail('Durasi minimal 1 hari.');
      if (durasi > maks) fail('Untuk sewa lebih dari ' + maks + ' hari gunakan paket bulanan. Hubungi pengelola.');
      var selesai = vrAddDays(mulai, durasi), lokasi = txt(req.lokasi, 300);
      if (lokasi.length < 5) fail('Isi lokasi pengambilan / penjemputan.');
      if (bentrok(u.id, mulai, selesai, '', s)) fail('Unit ini sudah dipesan pada tanggal tersebut. Pilih tanggal atau unit lain.');
      var tarif = tarifOf(s, u.jenis);
      if (tarif <= 0) fail('Tarif belum diatur pengelola.');
      var h = vrHitung(tarif * durasi, komisiOf(s)), id = newBookingId();
      store.insert('Booking', {
        id: id, waktu: nowIso(), unit_id: String(u.id), pemilik_id: String(u.pemilik_id), member_id: P.member ? String(P.member.id) : '',
        nama: P.nama, hp: P.hp, layanan: layanan, tipe: 'harian', jenis_unit: u.jenis, penumpang: '', bandara: '',
        tgl_mulai: mulai, durasi: durasi, tgl_selesai: selesai, jam: txt(req.jam, 10),
        lokasi: lokasi, tujuan: '', catatan: txt(req.catatan, 300), tarif: tarif, total: h.total, komisi: h.komisi,
        bagian_pemilik: h.bagian_pemilik, diskon_poin: 0, bayar: h.total, poin_didapat: 0, metode: txt(req.metode, 20), bayar_lapor: '', status: 'menunggu_bayar',
        unit_siap: 'tidak', driver: '', payout: 'belum', payout_waktu: '', harga_waktu: '',
        riwayat: JSON.stringify([{ s: 'menunggu_bayar', t: nowIso(), oleh: 'perental' }]), diubah: nowIso()
      });
      notify('admin', 'Booking baru', P.nama + ' - ' + u.merk + ' ' + u.model + ', ' + durasi + ' hari (' + id + ')', id);
      return { booking: bookingOut(findBooking(id)) };
    },
    /* Antar bandara / city tour / tour wisata: harga ditentukan pengelola */
    buatTrip: function (req) {
      var layanan = String(req.layanan || '');
      if (!VR_LAYANAN[layanan] || VR_LAYANAN[layanan].tipe !== 'trip') fail('Pilih layanan perjalanan.');
      var jenis = String(req.jenis_unit || '');
      if (jenis !== 'mobil5' && jenis !== 'mobil7') fail('Pilih jenis mobil (5 atau 7 seat).');
      var P = perentalDari(req);
      var mulai = vrDateKey(req.tgl_mulai), durasi = Math.max(1, Math.floor(num(req.durasi) || 1));
      if (!mulai) fail('Pilih tanggal perjalanan.');
      if (mulai < vrToday()) fail('Tanggal tidak boleh sebelum hari ini.');
      if (durasi > 14) fail('Durasi perjalanan maksimal 14 hari.');
      var lokasi = txt(req.lokasi, 300), tujuan = txt(req.tujuan, 600), bandara = txt(req.bandara, 120);
      if (lokasi.length < 5) fail('Isi alamat penjemputan.');
      if (!txt(req.jam, 10)) fail('Isi jam penjemputan.');
      if (layanan === 'bandara' && !bandara) fail('Pilih bandara.');
      if (layanan === 'wisata' && tujuan.length < 3) fail('Isi spot wisata yang ingin dikunjungi.');
      var pen = Math.floor(num(req.penumpang)) || 1;
      if (pen > VR_JENIS[jenis].kapasitas) fail('Jumlah penumpang melebihi kapasitas ' + VR_JENIS[jenis].label + '.');
      var id = newBookingId();
      store.insert('Booking', {
        id: id, waktu: nowIso(), unit_id: '', pemilik_id: '', member_id: P.member ? String(P.member.id) : '',
        nama: P.nama, hp: P.hp, layanan: layanan, tipe: 'trip', jenis_unit: jenis, penumpang: pen, bandara: bandara,

    kirimLokasi: function (req) {

      if (req.peran === 'driver') { var d = authDriver(req); if (b.driver !== d.nama) fail('Booking ini bukan tugas Anda.'); oleh = 'driver ' + d.nama; }
      else {
        if (req.member_id) { var m = authMember(req); if (String(b.member_id) !== String(m.id) && vrNormWa(b.hp) !== vrNormWa(m.wa)) fail('Booking bukan milik Anda.'); }
        else if (vrNormWa(req.hp) !== vrNormWa(b.hp)) fail('Booking bukan milik Anda.');
        if (b.layanan !== 'lepas') fail('Pelacakan penyewa hanya untuk sewa lepas kunci.');
        oleh = 'penyewa';
      }
      if (!bookingAktifLacak(b) || (oleh === 'penyewa' && b.status !== 'berjalan')) return { stop: true, status: b.status };
      var lat = num(req.lat), lng = num(req.lng);
      if (!lat || !lng || Math.abs(lat) > 90 || Math.abs(lng) > 180) fail('Koordinat tidak valid.');
      var titik = { lat: Math.round(lat * 1e6) / 1e6, lng: Math.round(lng * 1e6) / 1e6, spd: Math.round(num(req.spd) * 10) / 10, acc: Math.round(num(req.acc)),
        bat: Math.round(num(req.bat)), t: nowIso(), oleh: oleh };
      if (!store.livePut) fail('Live location belum tersedia.');
      store.livePut('L:' + b.id, titik);
      var tr = store.liveGet('T:' + b.id) || [];
      var akhir = tr[tr.length - 1];
      if (!akhir || Math.abs(akhir[0] - titik.lat) + Math.abs(akhir[1] - titik.lng) > 0.00015) { tr.push([titik.lat, titik.lng, Date.now()]); if (tr.length > 400) tr = tr.slice(-400); store.livePut('T:' + b.id, tr); }
      return { ok: true, status: b.status };

<script>
(function () {

    if (S.ro) return renderAturRO();
    var s = S.d.pengaturan, f = function (k, label, hint, type) {
      return '<label class="f">' + label + (hint ? ' <span class="hint">' + hint + '</span>' : '') + (type === 'area' ? '<textarea data-k="' + k + '">' + esc(s[k] || '') + '</textarea>' : '<input data-k="' + k + '" value="' + esc(s[k] || '') + '"' + (type ? ' inputmode="' + type + '"' : '') + '>') + '</label>';
    };
    app.innerHTML = shortHero('Pengaturan', 'Tarif, pembayaran, layanan & poin') + '<main>' +
      '<div class="card stack"><h3>Tarif harian</h3><div class="xs muted">Mobil termasuk driver; harga sama untuk lepas kunci. Antar bandara, city tour & tour wisata ditentukan per permintaan.</div>' +
      f('tarif_motor', 'Motor listrik', '', 'numeric') + f('tarif_mobil5', 'Mobil 5 seat', '', 'numeric') + f('tarif_mobil7', 'Mobil 7 seat', '', 'numeric') + f('komisi', 'Potongan admin (%)', 'dari nilai sewa', 'decimal') + f('info_bulanan', 'Info sewa bulanan', '', 'area') + '</div>' +
      '<div class="card stack"><h3>Metode pembayaran</h3><div class="xs muted">Isi nomor & nama pemilik akun. Metode yang kosong tidak ditampilkan ke penyewa.</div>' +
      f('rek_bca', 'Bank BCA', 'nomor rekening a.n. ...') + f('linkaja', 'LinkAja', 'nomor a.n. ...') + f('dana', 'DANA', 'nomor a.n. ...') + f('gopay', 'GoPay', 'nomor a.n. ...') + f('ovo', 'OVO', 'nomor a.n. ...') +
      f('qris', 'QRIS', 'link gambar QRIS publik (Google Drive / hosting gambar)') + f('batas_bayar_jam', 'Batas waktu bayar (jam)', 'booking batal otomatis bila lewat', 'numeric') + f('maks_hari', 'Maksimal sewa harian (hari)', 'lebih dari ini = bulanan', 'numeric') + '</div>' +
      '<div class="card stack"><h3>Sistem poin</h3>' + f('poin_per_rp', 'Transaksi per 1 poin (Rp)', 'default 1000 → Rp1.000 = 1 poin', 'numeric') + f('poin_min_tukar', 'Minimal penukaran (poin)', '1 poin = Rp1', 'numeric') + f('poin_maks_persen', 'Maksimal potongan (%)', 'dari total transaksi', 'decimal') + '</div>' +
      '<div class="card stack"><h3>Layanan & tampilan</h3>' + f('bandara', 'Daftar bandara', 'pisahkan dengan ;') + f('outlet', 'Lokasi outlet', 'Nama=alamat;Nama2=alamat2', 'area') + f('promo', 'Banner promo', 'Judul=keterangan;Judul2=keterangan2', 'area') +
      f('kota', 'Kota layanan', 'pisahkan dengan ;') + f('jam_layanan', 'Jam layanan') + '</div>' +
      '<div class="card stack"><h3>Operasional</h3>' + f('nama_app', 'Nama aplikasi') + f('admin_wa', 'WhatsApp admin', 'menerima booking', 'tel') + f('driver', 'Daftar driver', 'Nama=nomorWA=PIN;Nama2=nomorWA=PIN (PIN untuk mode Driver di aplikasi Mitra)', 'area') +
      '<label class="f">PIN pengelola baru <span class="hint">kosongkan bila tidak diganti</span><input id="np" type="password" inputmode="numeric" maxlength="8"></label></div>' +
      '<div class="card stack"><h3>Admin ke-2 (Monitor)</h3><div class="xs muted">Akun monitor hanya bisa melihat booking, armada, pengguna & peta live. Tidak bisa verifikasi, menyetujui, mengubah harga, atau pengaturan. Masuk lewat aplikasi <b>Vast Travel Monitor</b> atau versi web.</div>' +
      '<div class="row between"><span>Status</span><b>' + (S.d.monitor_aktif ? 'Aktif' : 'Belum diaktifkan') + '</b></div>' +
      '<label class="f">PIN monitor baru <span class="hint">4-8 angka, berbeda dari PIN pengelola. Isi "-" untuk menonaktifkan</span><input id="mp" inputmode="numeric" maxlength="8"></label></div>' +
      (V.CFG.API_URL ? '<div class="card stack"><h3>Versi web (komputer)</h3><div class="xs muted">Buka di browser laptop/PC untuk tampilan layar lebar & peta live.</div>' +
        '<div class="row between"><span>Pengelola</span><button class="btn sm ghost" data-cp="' + esc(V.CFG.URL_WEB || (V.CFG.API_URL + '?page=admin')) + '">Salin link</button></div>' +
        '<div class="row between"><span>Monitor</span><button class="btn sm ghost" data-cp="' + esc((V.CFG.URL_WEB ? V.CFG.URL_WEB + '?page=monitor' : V.CFG.API_URL + '?page=monitor')) + '">Salin link</button></div></div>' : '') +
      '<button class="btn go block" id="sv">Simpan pengaturan</button><button class="btn ghost block" id="out">Keluar</button>' +
      '<div class="card stack"><h3>Tautan aplikasi</h3>' + [['Penyewa', V.CFG.URL_PERENTAL], ['Mitra pemilik', V.CFG.URL_PEMILIK]].map(function (x) { return x[1] ? '<div class="row between"><span>' + x[0] + '</span><button class="btn sm ghost" data-cp="' + esc(x[1]) + '">Salin link</button></div>' : ''; }).join('') + '<div class="xs muted">Bagikan file APK Vast Travel & Vast Travel Mitra.</div></div></main>';
    bindHero();
    document.getElementById('sv').onclick = function () {
      var b = this, v = {};
      app.querySelectorAll('[data-k]').forEach(function (x) { v[x.dataset.k] = x.value; });
      var np = document.getElementById('np').value; if (np) v.admin_pin_baru = np;
      var mp = document.getElementById('mp').value.trim(); if (mp) v.monitor_pin_baru = mp;
      V.busy(b, true);
      V.api('adminPengaturan', { pin: S.pin, nilai: v }).then(function () { if (np) { S.pin = np; V.lsSet('vt_admin', np); } V.toast('Pengaturan tersimpan.'); V.busy(b, false); load(); })
        .catch(function (e) { V.busy(b, false); V.toast(e.message, true); });
    };
    document.getElementById('out').onclick = tanyaKeluar;
    app.querySelectorAll('[data-cp]').forEach(function (x) { x.onclick = function () { V.copy(x.dataset.cp); }; });
  }

  function render() { if (!S.d) return; if (S.tab !== 'peta' && S.tab !== 'beranda') stopLive(); else if (S.live && !document.body.contains(S.live.el)) stopLive();
    ({ beranda: renderBeranda, booking: renderBooking, armada: renderArmada, user: renderUser, atur: renderAtur, peta: renderPeta })[S.tab](); }
  load();
  setInterval(function () { if (S.d && document.visibilityState === 'visible' && !document.getElementById('sheet') && S.tab !== 'atur' && S.tab !== 'peta' && ['INPUT', 'SELECT', 'TEXTAREA'].indexOf(document.activeElement.tagName) < 0) load(); }, 45000);
})();
</script>
</body>
</html>
